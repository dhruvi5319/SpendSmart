# Render Blueprint - Infrastructure as Code
# https://render.com/docs/blueprint-spec

services:
  # FastAPI Backend
  - type: web
    name: spendsmart-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: ./apps/api
    region: oregon
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false  # Set manually in Render dashboard
      - key: JWT_SECRET
        generateValue: true
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: CORS_ORIGINS
        value: https://spendsmart.vercel.app,http://localhost:3000
      - key: ENVIRONMENT
        value: production
